services:
  tuc:
    image: ${TUC_IMAGE:-pidmitrius/tuc:${TUC_TAG:-latest}}
    user: "${TUC_UID:-10001}:${TUC_GID:-10001}"
    command: [serve, -base, "${TUC_BASE:-https://${TUC_HOST:?set permanent hostname}}", -publish, "${TUC_PUBLISH:-http://${TUC_HOST}}", -db, /var/lib/tuc/tuc.db]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ulimits:
      core: 0
    tmpfs:
      - /run/tuc:uid=${TUC_UID:-10001},gid=${TUC_GID:-10001},mode=0700
      - /tmp:uid=${TUC_UID:-10001},gid=${TUC_GID:-10001},mode=0700
    ports: ["${TUC_BIND:-127.0.0.1:8080}:8080"]
    volumes: [data:/var/lib/tuc]
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: ${TUC_MEMORY:-512m}
    memswap_limit: ${TUC_MEMORY:-512m}
    cpus: ${TUC_CPUS:-2}
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
  maintenance:
    image: ${TUC_IMAGE:-pidmitrius/tuc:${TUC_TAG:-latest}}
    profiles: [tools]
    user: "${TUC_UID:-10001}:${TUC_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    volumes:
      - data:/data
      - backups:/backup
      - ./deploy/prepare.sh:/tools/prepare.sh:ro
volumes:
  data: {}
  backups:
    external: true
    name: ${TUC_BACKUP_VOLUME:?set backup volume name}
