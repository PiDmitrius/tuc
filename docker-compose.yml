services:
  tuc:
    image: ${TUC_IMAGE:-pidmitrius/tuc:${TUC_TAG:-latest}}
    user: "${TUC_UID:-10001}:${TUC_GID:-10001}"
    command: [serve, -base, "${TUC_BASE:-https://${TUC_HOST:?set permanent hostname}}", -publish, "${TUC_PUBLISH:-http://${TUC_HOST}}", -db, /var/lib/tuc/tuc.db]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ulimits:
      core: 0
    tmpfs:
      - /run/tuc:uid=${TUC_UID:-10001},gid=${TUC_GID:-10001},mode=0700
      - /tmp:uid=${TUC_UID:-10001},gid=${TUC_GID:-10001},mode=0700
    volumes: [data:/var/lib/tuc]
    networks: [backend]
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: ${TUC_MEMORY:-512m}
    memswap_limit: ${TUC_MEMORY:-512m}
    cpus: ${TUC_CPUS:-2}
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
  proxy:
    image: ${CADDY_IMAGE:-caddy:2.11.4-alpine}
    user: "${TUC_UID:-10001}:${TUC_GID:-10001}"
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    environment:
      TUC_HOST: ${TUC_HOST}
      TUC_UPSTREAM: tuc:8080
      TUC_TRUSTED_CIDRS: ${TUC_TRUSTED_CIDRS:-127.0.0.1/32}
    ports: ["${TUC_HTTPS_BIND:?set HTTPS address and port}:443", "${TUC_HTTP_BIND:?set HTTP address and port}:80"]
    volumes:
      - ./deploy/${TUC_PROXY_CONFIG:-Caddyfile.open}:/etc/caddy/Caddyfile:ro
      - ${TUC_TLS_DIR:?set TLS certificate directory}:/tls:ro
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    sysctls: {net.ipv4.ip_unprivileged_port_start: "0"}
    ulimits:
      core: 0
    tmpfs:
      - /config:uid=${TUC_UID:-10001},gid=${TUC_GID:-10001},mode=0700
      - /data:uid=${TUC_UID:-10001},gid=${TUC_GID:-10001},mode=0700
    networks:
      backend: {}
      frontend:
        aliases: ["${TUC_HOST}"]
    restart: unless-stopped
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
  maintenance:
    image: ${TUC_IMAGE:-pidmitrius/tuc:${TUC_TAG:-latest}}
    profiles: [tools]
    user: "${TUC_UID:-10001}:${TUC_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    volumes:
      - data:/data
      - backups:/backup
      - ./deploy/prepare.sh:/tools/prepare.sh:ro
volumes:
  data: {}
  backups:
    external: true
    name: ${TUC_BACKUP_VOLUME:?set backup volume name}
networks:
  backend: {internal: true}
  frontend:
    external: true
    name: ${TUC_FRONT_NETWORK:?set frontend network}
